server:
  port: 19456
  servlet:
    context-path: /api

spring:
  application:
    name: wind-defect-review
  datasource:
    url: jdbc:h2:mem:winddefect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

windfarm:
  defect:
    wind-speed-threshold: 12.0
    suspected-crack-types:
      - CRACK_SUSPECTED
      - SURFACE_CRACK
    max-reshoot-count: 2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
